[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-blender"
version = "0.19.0"
description = "Natural language to Blender Python scripts via the Claude API. Single-file CLI, pure Python, ARM-compatible."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Désiré Nzengou", email = "desire.yavro@gmail.com" }]
keywords = [
    "blender",
    "bpy",
    "claude",
    "anthropic",
    "mcp",
    "model-context-protocol",
    "llm",
    "generative-3d",
    "ai-3d",
    "text-to-3d",
    "prompt-to-3d",
    "procedural",
    "geospatial",
    "space-metaverse",
    "galileo",
    "copernicus",
    "agents",
    "agents.md",
    "llms.txt",
    "cli",
    "arm64",
    "apple-silicon",
    "raspberry-pi",
    "graviton",
    "evoskillops",
    "skillops",
    "flywheel",
    "fine-tuning-corpus",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["anthropic>=0.57.0"]

[project.urls]
Homepage = "https://github.com/dnzengou/claude-blender"
Repository = "https://github.com/dnzengou/claude-blender"
Documentation = "https://github.com/dnzengou/claude-blender#readme"
"Bug Tracker" = "https://github.com/dnzengou/claude-blender/issues"
"Agent Manifest" = "https://github.com/dnzengou/claude-blender/blob/main/.well-known/agents.json"

[project.scripts]
claude-blender = "blender_gen:main"
blender-gen = "blender_gen:main"

[tool.setuptools]
py-modules = ["blender_gen"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Keep the rule set narrow and stable; matches pre-0.6 ruff defaults so CI
# across ruff versions stays deterministic.
select = ["E4", "E7", "E9", "F"]
